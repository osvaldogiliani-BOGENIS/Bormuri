; Firmware del Raspberry Pi Pico 2 (RP2350), coprocessore luci e ventola.
; Core Arduino di Earle Philhower tramite la piattaforma di Max Gerhardt.
[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.9.0
