; Firmware della Pimoroni Plasma 2350 (RP2350A, come il Pico 2): bocca OLED,
; catena LED unica, pulsante e sensore di temperatura su Qw/ST.
; Core Arduino di Earle Philhower tramite la piattaforma di Max Gerhardt.
; Si usa la scheda generica rpipico2 (stesso chip e 4 MB di flash) con i pin
; della Plasma definiti in src/main.cpp.
[env:plasma2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.9.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
; FastLED include librerie opzionali (Bluetooth, rete) che questo core non compila
; senza attivarle: non servono.
lib_ignore =
    BTstack
    lwIP_Ethernet
    lwIP_CYW43
    WiFi
    BluetoothHIDMaster
